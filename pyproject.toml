[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "globaltimezonebot"
version = "0.1.0"
description = "Revived Telegram bot for world time lookups and saved timezone collections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "astral>=3.2",
  "geopy>=2.4.1",
  "pycountry>=24.6.1",
  "python-telegram-bot[webhooks]>=22.0,<23.0",
  "timezonefinder>=6.5.8",
  "tzdata>=2025.2",
]

[project.scripts]
globaltimezonebot = "globaltimezonebot.__main__:main"

[dependency-groups]
dev = [
  "pre-commit>=4.2.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.2",
  "ty>=0.0.1a17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/globaltimezonebot"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".venv",
  "legacy",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "RUF", "N", "A", "COM", "T20", "Q", "RET", "ERA", "TRY", "FLY", "PERF", "FURB", "PIE", "RSE", "G", "DTZ", "INP"]
ignore = ["COM812"]

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ty.rules]
all = "error"
